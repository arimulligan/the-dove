<!DOCTYPE html>
<html>
<head>
    <title>The Dove</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="popupCSS.css">
</head>
<body>
    <div class="flex-container">
        <h1>The Do<span class="v-container"></span>e <button class="settings-cog" data-target="settingsTab"></button></h1>
        <div class="bg-container" id="content">
            <h2>Settings</h2>
            <h3 style="font-size:20px; border:5px solid #04668C; border-radius: 10px;">Interactive Dove Reminders</h3>
            <div class="column-container">
                <div class="row-container">
                    <h4>Turn on/off reminders indefinitely</h4>
                    <button id="onOrOff" class="edit-buttons"></button>
                </div>
                <div class="row-container">
                    <h4>Change the reminder frequency here</h4>
                    <div class="column-container">
                        <input id="remIntervals" type="range" min="0.02" max="5.0" style="width: 90%;" step="0.02"></input>
                        <h4 id="remIntervalsValue"></h4>
                    </div>
                </div>
                <div class="row-container">
                    <h4>Make dove fly down on current page?</h4>
                    <div class="column-container">
                        <button id="showDoveNow" class="edit-buttons">Show dove!</button>
                        <h4 style="font-size:10px;">You need to be on a page with a valid URL (e.g. not a new tab).</h4>
                    </div>
                </div>
            </div>
            <h3 style="font-size:20px; border:5px solid #04668C; border-radius: 10px;">Bible Verses</h3>
            <div class="column-container">
                <div class="row-container">
                    <h4>Choose which Bible verses to display</h4>
                </div>
                <div class="row-container">
                    <h4>Font size</h4>
                </div>
                <div class="row-container">
                    <h4>Colours</h4>
                </div>
            </div>
        </div>
        
    </div>
    <script src="popupJS.js"></script>
</body>
</html>
